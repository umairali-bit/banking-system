spring:
  application:
    name: banking-system

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

currency:
  exchange:
    base-url: https://api.frankfurter.dev

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  info:
    env:
      enabled: true

info:
  app:
    name: Banking System
    description: Banking application backend
    version: 1.0.0